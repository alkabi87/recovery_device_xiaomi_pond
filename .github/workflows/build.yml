name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev xsltproc unzip fontconfig \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf device/xiaomi/pond
          git clone \
            -b twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_pond-eng
          mka recoveryimage -j"$(nproc)"

      - name: Verify build output
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "=== POCO C75 PRODUCT DIRECTORY ==="
          ls -lah out/target/product/pond || true

          echo "=== ALL IMG/ZIP FILES UNDER OUT ==="
          find out -type f \( -name "*.img" -o -name "*.zip" \) -print | sort

          echo "=== REQUIRED RECOVERY IMAGE ==="
          if [ -f "out/target/product/pond/recovery.img" ]; then
            ls -lh "out/target/product/pond/recovery.img"
            file "out/target/product/pond/recovery.img"
          else
            echo "ERROR: out/target/product/pond/recovery.img was not produced."
            echo "=== RECOVERY-NAMED FILES ==="
            find out -type f -iname "*recovery*" -print | sort || true
            exit 1
          fi

      - name: Prepare artifacts
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp -v "out/target/product/pond/recovery.img" \
            "$GITHUB_WORKSPACE/artifacts/recovery.img"

          for f in \
            "out/target/product/pond/boot.img" \
            "out/target/product/pond/vendor_boot.img" \
            "out/target/product/pond/dtbo.img"; do
            if [ -f "$f" ]; then
              cp -v "$f" "$GITHUB_WORKSPACE/artifacts/"
            fi
          done

          echo "=== ARTIFACTS ==="
          ls -lah "$GITHUB_WORKSPACE/artifacts"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pond-build
          path: artifacts/
          if-no-files-found: error
