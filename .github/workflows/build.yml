name: Build TWRP 12.1 - POCO C75 (pond)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow Code
      uses: actions/checkout@v4

    - name: Clean Environment and Setup Swap Space
      run: |
        sudo swapoff -a || true
        sudo rm -f /swapfile
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo fallocate -l 12G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libmpath-0-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev python3 openjdk-11-jdk

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP 12.1 Source
      run: |
        mkdir twrp
        cd twrp
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1

    - name: Sync Source Code
      run: |
        cd twrp
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone POCO C75 Device Tree
      run: |
        cd twrp
        git clone https://github.com/Mayuri-Chan/recovery_device_xiaomi_pond.git -b android-12.1 device/xiaomi/pond

    - name: Build TWRP (Vendor Boot / Boot Image)
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_pond-eng || lunch omni_pond-eng
        make clean
        make vendorbootimage -j$(nproc --all) || make bootimage -j$(nproc --all) || make recoveryimage -j$(nproc --all)

    - name: Package Output Artifacts
      run: |
        cd twrp
        mkdir -p artifact
        find out/target/product/pond/ -maxdepth 1 -type f \( -name "*.img" -o -name "*.zip" \) -exec cp {} artifact/ \;

    - name: Upload TWRP Build Output
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-POCO-C75-pond
        path: twrp/artifact/*
