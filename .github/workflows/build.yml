name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            curl \
            zlib1g-dev \
            libc6-dev-i386 \
            libncurses5 \
            libncurses5-dev \
            x11proto-core-dev \
            libx11-dev \
            libreadline-dev \
            libgl1-mesa-dev \
            xsltproc \
            unzip \
            fontconfig \
            python3 \
            python-is-python3

      - name: Install repo
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version

      - name: Initialize TWRP source
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/twrp"

          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP source
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf device/xiaomi/pond

          git clone \
            --depth=1 \
            -b twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

          test -f device/xiaomi/pond/BoardConfig.mk
          test -f device/xiaomi/pond/twrp_pond.mk

          echo "Device tree OK"

      - name: Build TWRP vendor_boot
        run: |
          set -e
          set -o pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " INITIALIZING TWRP BUILD ENVIRONMENT"
          echo "========================================"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh

          lunch twrp_pond-eng

          echo "========================================"
          echo " CHECKING MKA"
          echo "========================================"

          command -v mka
          type mka

          echo "========================================"
          echo " BUILDING VENDOR_BOOT"
          echo "========================================"

          mka vendorbootimage

          echo "========================================"
          echo " BUILD FINISHED"
          echo "========================================"

      - name: Find all IMG files
        if: success()
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo " ALL IMG FILES"
          echo "========================================"

          find out \
            -type f \
            -name "*.img" \
            -print \
            | sort

      - name: Collect IMG files
        if: success()
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          count=0

          while IFS= read -r -d '' file; do
            filename="$(basename "$file")"

            echo "Copying:"
            echo "$file"

            cp -L "$file" \
              "$GITHUB_WORKSPACE/artifacts/$filename"

            count=$((count + 1))
          done < <(
            find out \
              -type f \
              -name "*.img" \
              -print0
          )

          echo "IMG count: $count"

          if [ "$count" -eq 0 ]; then
            echo "ERROR: No IMG files were produced."
            exit 1
          fi

          echo "========================================"
          echo " ARTIFACTS"
          echo "========================================"

          find "$GITHUB_WORKSPACE/artifacts" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            -exec ls -lh {} \;

      - name: Upload IMG files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-poco-c75-images
          path: artifacts/*.img
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          echo "========================================"
          echo " BUILD SUMMARY"
          echo "========================================"

          if [ -d "$GITHUB_WORKSPACE/artifacts" ]; then
            find "$GITHUB_WORKSPACE/artifacts" \
              -maxdepth 1 \
              -type f \
              -name "*.img" \
              -exec ls -lh {} \; || true
          fi
