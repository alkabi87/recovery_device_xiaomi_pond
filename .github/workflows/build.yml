name: Build TWRP 12.1 - POCO C75

on:
  push:
    branches:
      - twrp-12.1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev xsltproc unzip fontconfig \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j$(nproc)

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf device/xiaomi/pond
          git clone \
            -b twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_pond-eng
          mka recoveryimage

      - name: Find build outputs
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          echo "=== POCO C75 build outputs ==="
          find out/target/product/pond \
            -type f \( -name "*.img" -o -name "*.zip" \) \
            -print

      - name: Prepare artifacts
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find out/target/product/pond \
            -type f \( -name "*.img" -o -name "*.zip" \) \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "=== Files prepared for upload ==="
          ls -lah "$GITHUB_WORKSPACE/artifacts"

          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -type f -print -quit)"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pond-build
          path: artifacts/
          if-no-files-found: error
