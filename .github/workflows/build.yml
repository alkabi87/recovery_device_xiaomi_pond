name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev xsltproc unzip fontconfig \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf device/xiaomi/pond

          git clone \
            --branch twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Verify device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          test -f device/xiaomi/pond/BoardConfig.mk
          test -f device/xiaomi/pond/prebuilt/kernel

          echo "=== Recovery configuration ==="
          grep -nE \
            'TARGET_NO_RECOVERY|BOARD_BOOT_HEADER_VERSION|BOARD_USES_GENERIC_KERNEL_IMAGE|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT' \
            device/xiaomi/pond/BoardConfig.mk

          echo "=== Kernel ==="
          ls -lh device/xiaomi/pond/prebuilt/kernel

      - name: Configure TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_pond-eng

      - name: Build vendor_boot
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          mka vendorbootimage

      - name: Verify vendor_boot
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "=== Pond output directory ==="
          ls -lah out/target/product/pond

          echo "=== Generated images ==="
          find out/target/product/pond \
            -maxdepth 1 \
            -type f \
            \( -name "*.img" -o -name "*.zip" \) \
            -print | sort

          test -f out/target/product/pond/vendor_boot.img

          echo "SUCCESS: vendor_boot.img exists"
          ls -lh out/target/product/pond/vendor_boot.img

      - name: Prepare artifacts
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp -v \
            out/target/product/pond/vendor_boot.img \
            "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"

          for file in \
            boot.img \
            init_boot.img \
            recovery.img \
            dtbo.img \
            vbmeta.img \
            vendor_boot.img; do

            if [ -f "out/target/product/pond/$file" ]; then
              cp -v \
                "out/target/product/pond/$file" \
                "$GITHUB_WORKSPACE/artifacts/$file"
            fi
          done

          find out/target/product/pond \
            -maxdepth 1 \
            -type f \
            -name "*.zip" \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "=== FINAL ARTIFACTS ==="
          ls -lah "$GITHUB_WORKSPACE/artifacts"

          test -f "$GITHUB_WORKSPACE/artifacts/vendor_boot.img"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pond-vendor-boot
          path: artifacts/
          if-no-files-found: error
