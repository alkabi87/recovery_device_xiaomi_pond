name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl unzip xsltproc fontconfig \
            zlib1g-dev libc6-dev-i386 \
            libncurses5 libncurses5-dev \
            x11proto-core-dev libx11-dev \
            libreadline-dev libgl1-mesa-dev \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf device/xiaomi/pond

          git clone \
            --branch twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Configure Android build
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_pond-eng

          echo "=== BUILD ENVIRONMENT READY ==="
          type mka || true
          type make || true

      - name: Build TWRP vendor_boot
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_pond-eng

          echo "=== STARTING VENDOR_BOOT BUILD ==="

          if type mka >/dev/null 2>&1; then
            mka vendorbootimage -j"$(nproc)"
          else
            echo "mka unavailable, using build/soong/soong_ui.bash"

            build/soong/soong_ui.bash \
              --make-mode \
              vendorbootimage \
              -j"$(nproc)"
          fi

      - name: Inspect build output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo "PRODUCT OUTPUT"
          echo "========================================"

          OUT="out/target/product/pond"

          if [ -d "$OUT" ]; then
            find "$OUT" \
              -type f \
              -printf '%P\t%s bytes\n' \
              | sort
          else
            echo "NO PRODUCT OUTPUT DIRECTORY"
          fi

          echo
          echo "========================================"
          echo "ALL IMG FILES"
          echo "========================================"

          if [ -d out ]; then
            find out \
              -type f \
              -iname "*.img" \
              -printf '%p\t%s bytes\n' \
              | sort
          fi

      - name: Collect every build output
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          OUT="$GITHUB_WORKSPACE/twrp/out/target/product/pond"
          ART="$GITHUB_WORKSPACE/artifacts"

          rm -rf "$ART"
          mkdir -p "$ART"

          if [ -d "$OUT" ]; then
            cp -a "$OUT/." "$ART/"
          else
            echo "Product output directory does not exist."
          fi

          echo "========================================"
          echo "FILES TO UPLOAD"
          echo "========================================"

          find "$ART" \
            -type f \
            -printf '%P\t%s bytes\n' \
            | sort

      - name: Upload all build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pond-complete-output
          path: artifacts/
          if-no-files-found: warn
          include-hidden-files: true
          compression-level: 0
