name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev xsltproc unzip fontconfig \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          repo sync -c --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf device/xiaomi/pond

          git clone \
            -b twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Configure Android build
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          source build/envsetup.sh

          lunch twrp_pond-eng

      - name: Build TWRP vendor_boot
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo "       BUILDING VENDOR_BOOT"
          echo "========================================"

          mka vendorbootimage

      - name: Inspect build output
        if: success()
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo "          BUILD OUTPUT"
          echo "========================================"

          echo "Searching entire out directory for IMG files..."

          find out \
            -type f \
            -name "*.img" \
            -print \
            | sort

      - name: Collect IMG outputs
        if: success()
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/twrp"

          echo "========================================"
          echo "       COLLECTING ALL IMG FILES"
          echo "========================================"

          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          find out \
            -type f \
            -name "*.img" \
            -exec cp -L {} "$GITHUB_WORKSPACE/artifacts/" \;

          echo "========================================"
          echo "       FINAL ARTIFACTS"
          echo "========================================"

          ls -lah "$GITHUB_WORKSPACE/artifacts"

          count=$(find "$GITHUB_WORKSPACE/artifacts" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            | wc -l)

          if [ "$count" -eq 0 ]; then
            echo "ERROR: NO IMG FILES WERE PRODUCED"
            exit 1
          fi

          echo "Found $count IMG file(s)."

      - name: Upload IMG outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-poco-c75-img
          path: artifacts/*.img
          if-no-files-found: error
          compression-level: 0

      - name: Complete job
        if: always()
        run: |
          echo "========================================"
          echo "             WORKFLOW DONE"
          echo "========================================"
