name: Build TWRP 12.1 - POCO C75

on:
  workflow_dispatch:
  push:
    branches:
      - twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses5 \
            x11proto-core-dev libx11-dev libreadline-dev \
            libgl1-mesa-dev xsltproc unzip fontconfig \
            python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Sync TWRP source
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j"$(nproc)"

      - name: Add POCO C75 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf device/xiaomi/pond

          git clone \
            --branch twrp-12.1 \
            https://github.com/alkabi87/recovery_device_xiaomi_pond.git \
            device/xiaomi/pond

      - name: Configure TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          source build/envsetup.sh
          lunch twrp_pond-eng

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          export ALLOW_MISSING_DEPENDENCIES=true

          echo "=== BUILDING VENDOR_BOOT ==="
          mka vendorbootimage

      - name: Find ANY IMG output
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          OUT="out/target/product/pond"

          echo "========================================"
          echo "SEARCHING FOR ALL IMG FILES"
          echo "========================================"

          if [ ! -d "$OUT" ]; then
            echo "ERROR: Product output directory does not exist."
            exit 1
          fi

          find "$OUT" \
            -type f \
            -iname "*.img" \
            -printf '%p\n' | sort

          IMG_COUNT=$(find "$OUT" \
            -type f \
            -iname "*.img" | wc -l)

          echo
          echo "IMG FILE COUNT: $IMG_COUNT"

          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "ERROR: BUILD FINISHED BUT NO .img FILE WAS PRODUCED."
            echo
            echo "ALL FILES IN PRODUCT OUTPUT:"
            find "$OUT" -type f -printf '%p\n' | sort
            exit 1
          fi

      - name: Collect ALL IMG files
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          OUT="out/target/product/pond"
          ART="$GITHUB_WORKSPACE/artifacts"

          rm -rf "$ART"
          mkdir -p "$ART"

          echo "========================================"
          echo "COPYING EVERY .IMG FILE"
          echo "========================================"

          find "$OUT" \
            -type f \
            -iname "*.img" \
            -exec cp -v {} "$ART/" \;

          echo
          echo "========================================"
          echo "FILES READY FOR UPLOAD"
          echo "========================================"

          find "$ART" \
            -type f \
            -printf '%f  %s bytes\n' | sort

          IMG_COUNT=$(find "$ART" \
            -type f \
            -iname "*.img" | wc -l)

          echo
          echo "TOTAL IMG FILES: $IMG_COUNT"

          if [ "$IMG_COUNT" -eq 0 ]; then
            echo "ERROR: NOTHING TO UPLOAD."
            exit 1
          fi

      - name: Upload IMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-pond-images
          path: artifacts/*.img
          if-no-files-found: error
          compression-level: 0
